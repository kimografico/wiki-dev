name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Calidad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos y esquemas
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      # El script `validate` (RF-10) llega en F1; --if-present lo activa sin fallar.
      - name: Validación de contenido
        run: npm run --if-present validate

      - name: Build
        run: npm run build
